<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-itunes-app" content="app-id=6754540871">
    <title>Shared card design — Churchill</title>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a2129;
            --text: #e6e6e6;
            --muted: #9aa5b1;
            --accent: #4a90e2;
            --accent-dark: #357abd;
            --border: #2a3441;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            max-width: 520px;
            width: 100%;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 24px;
            font-size: 14px;
        }

        .assets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 24px 0;
        }

        .assets figure {
            margin: 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #0a0f14;
        }

        .assets img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }

        .assets figcaption {
            font-size: 12px;
            color: var(--muted);
            padding: 6px 8px;
            text-align: center;
            border-top: 1px solid var(--border);
        }

        .btn {
            display: block;
            text-align: center;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-top: 12px;
            transition: background 0.15s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover { background: var(--accent-dark); }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { background: var(--border); }

        .status {
            text-align: center;
            color: var(--muted);
            padding: 40px 0;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .meta {
            color: var(--muted);
            font-size: 13px;
            display: flex;
            gap: 16px;
            margin-bottom: 8px;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <div id="loading" class="card status">
            <span class="spinner"></span>Loading shared design…
        </div>

        <div id="content" class="card" hidden>
            <h1 id="bundle-name">Shared card design</h1>
            <p class="subtitle" id="bundle-subtitle"></p>

            <div class="meta">
                <span id="bundle-date"></span>
            </div>

            <div class="assets" id="assets"></div>

            <a id="open-btn" class="btn btn-primary" href="#">Open in Churchill</a>
            <a id="install-btn" class="btn btn-secondary"
               href="https://apps.apple.com/app/id6754540871">
                Don't have the app? Get Churchill on the App Store
            </a>
        </div>

        <div id="error" class="card status" hidden>
            <p style="color:#e67e80;margin:0 0 8px;font-weight:600;">Couldn't load this design</p>
            <p id="error-detail" style="margin:0;"></p>
        </div>
    </main>

    <script>
        const SHARE_HOST = 'https://share.feingames.com';

        // Supports both /c/<id> (direct) and /c/?id=<id> (via the 404 redirect trick).
        function getShortID() {
            const pathMatch = window.location.pathname.match(/^\/c\/([a-f0-9]+)/i);
            if (pathMatch) return pathMatch[1];
            return new URLSearchParams(window.location.search).get('id');
        }

        function show(which) {
            for (const el of ['loading', 'content', 'error']) {
                document.getElementById(el).hidden = el !== which;
            }
        }

        function showError(msg) {
            document.getElementById('error-detail').textContent = msg;
            show('error');
        }

        async function load() {
            const id = getShortID();
            if (!id) { showError('No design ID in this URL.'); return; }

            try {
                const res = await fetch(`${SHARE_HOST}/c/${encodeURIComponent(id)}`);
                if (res.status === 404) { showError('This design has expired or was removed.'); return; }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                render(await res.json(), id);
            } catch (err) {
                showError(err.message || String(err));
            }
        }

        function render(bundle, id) {
            document.getElementById('bundle-name').textContent =
                bundle.name || 'Untitled card design';

            const alias = bundle.alias ? `by ${bundle.alias}` : 'shared anonymously';
            document.getElementById('bundle-subtitle').textContent = alias;

            const created = new Date(bundle.createdAt);
            if (!isNaN(created)) {
                document.getElementById('bundle-date').textContent =
                    `Shared ${created.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
            }

            const assetsEl = document.getElementById('assets');
            const entries = Object.entries(bundle.assets || {});
            if (entries.length === 0) {
                assetsEl.hidden = true;
            } else {
                for (const [name, url] of entries) {
                    const fig = document.createElement('figure');
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = name;
                    img.loading = 'lazy';
                    const cap = document.createElement('figcaption');
                    cap.textContent = name;
                    fig.appendChild(img);
                    fig.appendChild(cap);
                    assetsEl.appendChild(fig);
                }
            }

            // "Open in Churchill" just re-opens the canonical Universal Link. On iOS with
            // the app installed, the handoff is seamless. On anything else, it's a no-op.
            document.getElementById('open-btn').href = `https://feingames.com/c/${id}`;

            show('content');
        }

        load();
    </script>
</body>
</html>
